<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<title>Çerçeve</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;
  font-family:-apple-system,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.nocursor{cursor:none}
#stage{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden}
.slide{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;transition:opacity 1.3s ease}
.slide.cut{transition:none}
.slide.on{opacity:1}
.bg{position:absolute;top:-60px;left:-60px;right:-60px;bottom:-60px;background-size:cover;
  background-position:center;-webkit-filter:blur(28px) brightness(.5);filter:blur(28px) brightness(.5)}
.fg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:transparent}
.fg.cover{object-fit:cover}
.pan{-webkit-animation-timing-function:ease-in-out;animation-timing-function:ease-in-out;
  -webkit-animation-fill-mode:forwards;animation-fill-mode:forwards}
.pan.y{-webkit-animation-name:pany;animation-name:pany}
.pan.x{-webkit-animation-name:panx;animation-name:panx}
@-webkit-keyframes pany{0%,8%{object-position:50% 0%}92%,100%{object-position:50% 100%}}
@keyframes pany{0%,8%{object-position:50% 0%}92%,100%{object-position:50% 100%}}
@-webkit-keyframes panx{0%,8%{object-position:0% 50%}92%,100%{object-position:100% 50%}}
@keyframes panx{0%,8%{object-position:0% 50%}92%,100%{object-position:100% 50%}}
.pair{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;background:#000}
.pair.col{-webkit-flex-direction:column;flex-direction:column}
.cell{-webkit-flex:1;flex:1;position:relative;overflow:hidden}
.pair .cell+.cell{margin-left:6px}
.pair.col .cell+.cell{margin-left:0;margin-top:6px}
.cell img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.kb{-webkit-animation-name:kb;animation-name:kb;-webkit-animation-timing-function:linear;
  animation-timing-function:linear;-webkit-animation-fill-mode:forwards;animation-fill-mode:forwards}
@-webkit-keyframes kb{from{-webkit-transform:scale(1)}to{-webkit-transform:scale(1.09)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}

.shadow{text-shadow:0 1px 3px rgba(0,0,0,.7),0 2px 14px rgba(0,0,0,.6)}
#info{position:fixed;left:32px;bottom:26px;opacity:0;transition:opacity 1s;z-index:3;max-width:60%}
#info .a{font-size:24px;font-weight:600;letter-spacing:.2px}
#info .d{font-size:15px;opacity:.85;margin-top:3px}
#clock{position:fixed;right:32px;bottom:20px;font-size:46px;font-weight:200;z-index:3;letter-spacing:1px}
#msg{position:fixed;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);
  text-align:center;font-size:18px;line-height:1.5;opacity:.9;max-width:80%;white-space:pre-line;z-index:4;display:none}
#toast{position:fixed;top:24px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);
  background:rgba(20,20,20,.75);padding:10px 18px;border-radius:22px;font-size:15px;opacity:0;
  transition:opacity .6s;z-index:6;pointer-events:none}
#night{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;
  transition:opacity 3s;z-index:7}

/* Saat & hava durumu ara ekranı */
.ara .shade{position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.55) 0%,rgba(0,0,0,.8) 100%)}
.ara .wrap{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);
  text-align:center;width:90%}
.ara .big{font-size:26vmin;font-weight:200;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.ara .big .col{-webkit-animation:blink 2s steps(1) infinite;animation:blink 2s steps(1) infinite}
@-webkit-keyframes blink{50%{opacity:.25}}
@keyframes blink{50%{opacity:.25}}
.ara .date{font-size:5.6vmin;font-weight:400;margin-top:2.2vmin;opacity:.95;letter-spacing:.03em}
.ara .date b{font-weight:600}
.ara .sep{width:16vmin;height:2px;background:rgba(255,255,255,.35);margin:4.5vmin auto}
.ara .wx{display:inline-block;text-align:left;white-space:nowrap}
.ara .wx svg{width:15vmin;height:15vmin;vertical-align:middle;margin-right:2.5vmin}
.ara .wx .t{display:inline-block;vertical-align:middle}
.ara .wx .deg{font-size:13vmin;font-weight:300;line-height:1}
.ara .wx .desc{font-size:3.6vmin;opacity:.9;margin-top:.8vmin}
.ara .wx .mm{font-size:3vmin;opacity:.7;margin-top:.4vmin}
.ara .city{font-size:3vmin;opacity:.6;margin-top:3vmin;letter-spacing:.15em;text-transform:uppercase}

.ara .umb{display:inline-block;margin-top:3.4vmin;background:rgba(127,196,255,.18);border:1px solid rgba(127,196,255,.45);
  padding:1.2vmin 2.6vmin;border-radius:4vmin;font-size:3vmin}
.hv .now{white-space:nowrap}
.hv .now svg{width:20vmin;height:20vmin;vertical-align:middle;margin-right:3vmin}
.hv .now .t{display:inline-block;vertical-align:middle;text-align:left}
.hv .now .deg{font-size:16vmin;font-weight:300;line-height:1}
.hv .now .desc{font-size:4vmin;margin-top:1vmin}
.hv .now .mm{font-size:3.1vmin;opacity:.75;margin-top:.6vmin}
.hv .head{font-size:3.2vmin;opacity:.65;letter-spacing:.15em;text-transform:uppercase;margin-bottom:2.5vmin}
.hv .days{margin-top:4.5vmin;white-space:nowrap}
.hv .day{display:inline-block;width:15vmin;margin:0 1vmin;padding:2vmin 0;border-radius:2.4vmin;background:rgba(255,255,255,.09);vertical-align:top}
.hv .day.today{background:rgba(255,255,255,.18)}
.hv .day .n{font-size:3vmin;font-weight:600}
.hv .day svg{width:9vmin;height:9vmin;margin:1vmin 0}
.hv .day .x{font-size:3.2vmin}
.hv .day .x span{opacity:.6}
.hv .day .p{font-size:2.6vmin;color:#9fd2ff;margin-top:.6vmin;min-height:3vmin}

/* Not panosu */
.nt .head{font-size:3.4vmin;opacity:.8;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3vmin}
.nt .notes{white-space:normal}
.nt .note{display:inline-block;vertical-align:middle;text-align:left;color:#2b2416;margin:1.6vmin;padding:4vmin 4vmin 3vmin;
  border-radius:1.2vmin;box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.45);word-wrap:break-word}
.nt .note .txt{font-family:'Caveat','Segoe Print','Bradley Hand',cursive;line-height:1.12}
.nt .note .by{font-size:2.5vmin;opacity:.65;margin-top:2vmin}
.nt .n1 .note{width:66vmin}.nt .n1 .txt{font-size:9vmin}
.nt .n2 .note{width:42vmin}.nt .n2 .txt{font-size:6vmin}
.nt .n3 .note{width:29vmin}.nt .n3 .txt{font-size:4.6vmin}
.nt .note.sari{background:#FFE98A}.nt .note.pembe{background:#FFC2D4}.nt .note.mavi{background:#BFE3FF}.nt .note.yesil{background:#C8F0B8}
.nt.yeni .note{-webkit-animation:pop .8s cubic-bezier(.2,1.4,.4,1) both;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
@-webkit-keyframes pop{from{-webkit-transform:scale(.6);opacity:0}}
@keyframes pop{from{transform:scale(.6) rotate(0);opacity:0}}

/* Haberler */
.ara .hb{width:84%;text-align:left}
.hb .head{text-align:center;font-size:3.4vmin;opacity:.8;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2.6vmin}
.hb .hi{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start;padding:2.1vmin 0;
  border-bottom:1px solid rgba(255,255,255,.12)}
.hb .hi:last-child{border-bottom:0}
.hb .chip{-webkit-flex:none;flex:none;font-size:2.2vmin;font-weight:700;color:#14161a;padding:.7vmin 0;border-radius:2vmin;
  width:15vmin;text-align:center;margin:.5vmin 2.6vmin 0 0}
.hb .k-spor{background:#7ed88a}.hb .k-bilim{background:#b9a3ff}.hb .k-teknoloji{background:#7fd0ff}
.hb .k-kultur{background:#ffab8a}.hb .k-gezi{background:#ffd76a}
.hb .ttl{font-size:3.8vmin;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hb .meta{font-size:2.4vmin;opacity:.6;margin-top:.7vmin}
.kats label{display:inline-block;margin:4px 10px 4px 0;font-size:14px;white-space:nowrap}
.kats input{width:18px;height:18px;vertical-align:middle}

/* Spor */
.ara .sp{width:92%}
.sp .head{font-size:3.4vmin;opacity:.8;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2.4vmin}
.sp .grid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.sp .tk{width:44%;margin:1.1vmin;box-sizing:border-box;background:rgba(255,255,255,.08);border-radius:2.2vmin;padding:2.2vmin 2.6vmin;text-align:left}
@media (orientation:portrait){.sp .tk{width:94%}}
.sp .tt{font-size:3vmin;font-weight:700;letter-spacing:.04em}
.sp .tt span{font-weight:400;opacity:.6}
.sp .row2{margin-top:1.4vmin;font-size:3.1vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp .row2 small{font-size:2.3vmin;opacity:.6;margin-left:1vmin}
.ara .gbm{display:inline-block;width:3.6vmin;height:3.6vmin;line-height:3.6vmin;text-align:center;border-radius:.8vmin;font-size:2.3vmin;
  font-weight:800;color:#111;margin-right:1.2vmin;vertical-align:.2vmin}
.g-G{background:#6fdc8c}.g-B{background:#c9ced6}.g-M{background:#ff8b8b}
.sp .nx{opacity:.92}
.sp .hd{font-size:2.5vmin;opacity:.65;margin-top:1.2vmin;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mg .tag{display:inline-block;font-size:3.2vmin;font-weight:800;letter-spacing:.2em;padding:1vmin 3vmin;border-radius:4vmin;background:#e8c26a;color:#1b1406}
.mg .tag.live{background:#ff5d5d;color:#fff}
.mg .tag.fin{background:rgba(255,255,255,.2);color:#fff}
.mg .m{margin-top:3.5vmin}
.mg .ik{font-size:11vmin;line-height:1}
.mg .vs{font-size:6.6vmin;font-weight:600;margin-top:1.5vmin}
.mg .sc{font-size:13vmin;font-weight:300;margin-top:1vmin;letter-spacing:.05em}
.mg .info2{font-size:3.3vmin;opacity:.75;margin-top:1.2vmin}
.mg .cd{font-size:5vmin;margin-top:2.4vmin;color:#ffe08a}
.mg .m + .m{margin-top:5vmin;padding-top:4vmin;border-top:1px solid rgba(255,255,255,.15)}
.mg.two .ik{font-size:7vmin}.mg.two .vs{font-size:4.8vmin}.mg.two .sc{font-size:8vmin}.mg.two .cd{font-size:3.8vmin}

/* Bu gün, geçmiş yıllarda */
.aniw{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
.aniw .abg{position:absolute;top:-60px;left:-60px;right:-60px;bottom:-60px;background-size:cover;background-position:center;
  -webkit-filter:blur(28px) brightness(.45);filter:blur(28px) brightness(.45)}
.aniw img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;
  -webkit-animation:kb 14s linear forwards;animation:kb 14s linear forwards}
.aniw .band{position:absolute;left:0;right:0;bottom:0;padding:9vmin 5vmin 5vmin;
  background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,0));text-align:left}
.aniw .b0{display:inline-block;font-size:2.8vmin;font-weight:700;letter-spacing:.18em;background:#e8c26a;color:#1b1406;
  padding:.8vmin 2.2vmin;border-radius:3vmin}
.aniw .b1{font-size:7vmin;font-weight:600;margin-top:1.6vmin;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.aniw .b2{font-size:3.2vmin;opacity:.8;margin-top:.6vmin}

#bar{position:fixed;left:0;right:0;bottom:0;padding:22px 0 26px;text-align:center;z-index:8;
  background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0));opacity:0;pointer-events:none;transition:opacity .4s}
#bar.show{opacity:1;pointer-events:auto}
#bar button{width:64px;height:64px;margin:0 8px;border-radius:50%;border:0;background:rgba(255,255,255,.14);
  color:#fff;font-size:26px;line-height:64px;padding:0;cursor:pointer}
#bar button:active{background:rgba(255,255,255,.3)}
#bar .cnt{display:block;font-size:13px;opacity:.7;margin-top:10px}

.panel{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.82);z-index:9;display:none;
  overflow-y:auto;-webkit-overflow-scrolling:touch;cursor:default}
.panel.show{display:block}
.card{max-width:560px;margin:5vh auto;background:#16181c;border-radius:18px;padding:26px 28px;
  box-shadow:0 10px 40px rgba(0,0,0,.6)}
.card h2{margin:0 0 4px;font-size:24px;font-weight:600}
.card .sub{opacity:.6;font-size:14px;margin-bottom:18px}
.row{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;
  align-items:center;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;
  padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:16px}
.row:last-child{border-bottom:0}
.row label{-webkit-box-flex:1;-webkit-flex:1;flex:1;padding-right:12px}
select,input[type=text],input[type=time],input[type=url]{background:#24272d;color:#fff;border:1px solid #3a3e46;
  border-radius:9px;padding:9px 10px;font-size:15px}
input[type=text],input[type=url]{width:100%;box-sizing:border-box}
input[type=checkbox]{width:24px;height:24px}
.full{display:block;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.full label{display:block;margin-bottom:8px;font-size:16px}
.btns{margin-top:20px;text-align:right}
.btn{border:0;border-radius:10px;padding:12px 22px;font-size:16px;margin-left:8px;cursor:pointer}
.btn.p{background:#e8c26a;color:#1b1406;font-weight:600}
.btn.s{background:#2b2f36;color:#fff}
.hint{font-size:13px;opacity:.6;line-height:1.5;margin-top:8px}
.ver{float:left;font-size:12px;opacity:.45;margin-top:14px}
.err{color:#ff8a80;font-size:14px;margin-top:8px;min-height:18px}
</style>
</head>
<body class="nocursor">

<div id="stage"></div>
<div id="info" class="shadow"><div class="a" id="iAlbum"></div><div class="d" id="iDate"></div></div>
<div id="clock" class="shadow"></div>
<div id="msg" class="shadow"></div>
<div id="toast"></div>
<div id="night"></div>

<div id="bar">
  <button id="bPrev" title="Önceki">&#9664;</button>
  <button id="bPlay" title="Duraklat">&#10074;&#10074;</button>
  <button id="bNext" title="Sonraki">&#9654;</button>
  <button id="bFull" title="Tam ekran">&#x26F6;</button>
  <button id="bRef" title="Yenile">&#x21bb;</button>
  <button id="bSet" title="Ayarlar">&#9881;</button>
  <span class="cnt" id="cnt"></span>
</div>

<!-- İlk kurulum -->
<div class="panel" id="setup">
  <div class="card">
    <h2>Çerçeve</h2>
    <div class="sub">Drive klasörünüzü bağlayın</div>
    <div class="full">
      <label for="sApi">Apps Script web uygulaması adresi</label>
      <input type="url" id="sApi" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
      <div class="hint">Apps Script'te "Dağıt → Web uygulaması" sonrası verilen, <b>/exec</b> ile biten adres.</div>
      <div class="err" id="sErr"></div>
    </div>
    <div class="btns"><button class="btn p" id="sGo">Bağlan</button></div>
  </div>
</div>

<!-- Ayarlar -->
<div class="panel" id="settings">
  <div class="card">
    <h2>Ayarlar</h2>
    <div class="sub" id="stat">&nbsp;</div>

    <div class="row"><label for="oSure">Fotoğraf süresi</label>
      <select id="oSure">
        <option value="5">5 sn</option><option value="8">8 sn</option><option value="10">10 sn</option>
        <option value="15">15 sn</option><option value="20">20 sn</option><option value="30">30 sn</option>
        <option value="60">1 dk</option><option value="120">2 dk</option><option value="300">5 dk</option>
      </select></div>
    <div class="row"><label for="oYerlesim">Yerleşim</label>
      <select id="oYerlesim">
        <option value="akilli">Akıllı (ters yöndekiler ikili)</option>
        <option value="doldur">Hep doldur (kaydırarak)</option>
        <option value="sigdir">Tam sığdır (bulanık kenar)</option>
      </select></div>
    <div class="row"><label for="oGecis">Geçiş efekti</label>
      <select id="oGecis">
        <option value="fade">Yumuşak geçiş</option>
        <option value="kenburns">Yavaş yakınlaşma</option>
        <option value="yok">Geçişsiz</option>
      </select></div>
    <div class="row"><label for="oSira">Sıralama</label>
      <select id="oSira">
        <option value="karisik">Karışık</option>
        <option value="yeni">Yeniden eskiye</option>
        <option value="eski">Eskiden yeniye</option>
      </select></div>
    <div class="row"><label for="oVideo">Videoları oynat</label><input type="checkbox" id="oVideo"></div>
    <div class="row"><label for="oSes">Video sesi açık</label><input type="checkbox" id="oSes"></div>
    <div class="row"><label for="oYenile">Yeni dosya kontrolü</label>
      <select id="oYenile">
        <option value="1">Her 1 dk</option><option value="2">Her 2 dk</option><option value="5">Her 5 dk</option>
        <option value="10">Her 10 dk</option><option value="30">Her 30 dk</option>
      </select></div>
    <div class="row"><label for="oAra">Bilgi ekranları sıklığı</label>
      <select id="oAra">
        <option value="0">Kapalı</option><option value="5">Her 5 görselde</option>
        <option value="8">Her 8 görselde</option><option value="12">Her 12 görselde</option>
        <option value="20">Her 20 görselde</option>
      </select></div>
    <div class="row"><label for="oEkSaat">· Saat ekranı</label><input type="checkbox" id="oEkSaat"></div>
    <div class="row"><label for="oEkHava">· Hava durumu (5 gün)</label><input type="checkbox" id="oEkHava"></div>
    <div class="row"><label for="oEkNot">· Not panosu</label><input type="checkbox" id="oEkNot"></div>
    <div class="row"><label for="oEkHaber">· Haberler (filtreli)</label><input type="checkbox" id="oEkHaber"></div>
    <div class="full kats" id="oKats"><label style="display:block;margin-bottom:4px">Haber konuları</label>
      <label><input type="checkbox" value="spor"> Spor</label>
      <label><input type="checkbox" value="bilim"> Bilim</label>
      <label><input type="checkbox" value="teknoloji"> Teknoloji</label>
      <label><input type="checkbox" value="kultur"> Kültür-Sanat</label>
      <label><input type="checkbox" value="gezi"> Gezi</label>
    </div>
    <div class="row"><label for="oEkSpor">· Spor (maç günü modu dahil)</label><input type="checkbox" id="oEkSpor"></div>
    <div class="full kats" id="oTakims"><label style="display:block;margin-bottom:4px">Takımlar</label>
      <label><input type="checkbox" value="bjk_futbol"> Beşiktaş Futbol</label>
      <label><input type="checkbox" value="bjk_basket"> Beşiktaş Basketbol</label>
      <label><input type="checkbox" value="vakifbank"> VakıfBank</label>
      <label><input type="checkbox" value="milli"> Milli Takım</label>
    </div>
    <div class="row"><label for="oEkAni">· Bu gün, geçmiş yıllarda</label><input type="checkbox" id="oEkAni"></div>
    <div class="row"><label for="oAraSure">Bilgi ekranı süresi</label>
      <select id="oAraSure">
        <option value="8">8 sn</option><option value="10">10 sn</option><option value="15">15 sn</option>
        <option value="20">20 sn</option><option value="30">30 sn</option>
      </select></div>
    <div class="row"><label for="oBilgi">Albüm adı ve tarih</label><input type="checkbox" id="oBilgi"></div>
    <div class="row"><label for="oSaat">Saat göster</label><input type="checkbox" id="oSaat"></div>
    <div class="row"><label for="oBulanik">Bulanık arka plan (Tam sığdır modunda)</label><input type="checkbox" id="oBulanik"></div>
    <div class="row"><label>Gece modu (ekran kararır)</label>
      <span><input type="time" id="oGeceBas"> – <input type="time" id="oGeceBit"></span></div>
    <div class="full">
      <label for="oApi">Apps Script adresi</label>
      <input type="url" id="oApi" autocomplete="off">
    </div>

    <div class="btns">
      <span class="ver" id="ver"></span>
      <button class="btn s" id="oCancel">Vazgeç</button>
      <button class="btn p" id="oSave">Kaydet</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var VERSION = 'v1.7';
  var KEY = 'cerceve_ayar';
  var DEF = {
    api: '', sure: 10, yerlesim: 'akilli', gecis: 'fade', sira: 'karisik', video: true, ses: false,
    yenile: 5, araEkran: 8, araSure: 10, ekSaat: true, ekHava: true, ekNot: true, ekHaber: true, ekSpor: true, ekAni: true, sporTakim: 'bjk_futbol,bjk_basket,vakifbank,milli', haberKat: 'spor,bilim,teknoloji,kultur', sehir: 'İstanbul', lat: 41.01, lon: 28.98, bilgi: true, saat: true, bulanik: true, geceBas: '', geceBit: ''
  };

  function $(id) { return document.getElementById(id); }
  var stage = $('stage');

  // ---------- Ayarlar (localStorage + adres çubuğu #hash yedeği) ----------
  function cast(k, v) {
    var t = typeof DEF[k];
    if (t === 'number') { var n = parseFloat(v); return isNaN(n) ? DEF[k] : n; }
    if (t === 'boolean') return v === true || v === '1' || v === 'true';
    return String(v);
  }
  function loadCfg() {
    var c = {}, k;
    for (k in DEF) c[k] = DEF[k];
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      for (k in s) if (DEF.hasOwnProperty(k)) c[k] = cast(k, s[k]);
    } catch (e) {}
    var h = location.hash.replace(/^#/, '');
    if (h) {
      h.split('&').forEach(function (p) {
        var i = p.indexOf('=');
        if (i < 0) return;
        var key = decodeURIComponent(p.slice(0, i));
        if (DEF.hasOwnProperty(key)) c[key] = cast(key, decodeURIComponent(p.slice(i + 1)));
      });
    }
    return c;
  }
  function saveCfg() {
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
    var parts = [];
    for (var k in cfg) {
      if (cfg[k] !== DEF[k]) {
        var v = typeof cfg[k] === 'boolean' ? (cfg[k] ? '1' : '0') : cfg[k];
        parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
      }
    }
    try { history.replaceState(null, '', location.pathname + location.search + (parts.length ? '#' + parts.join('&') : '')); } catch (e) {}
  }
  var cfg = loadCfg();

  // ---------- Drive adresleri ----------
  var W = Math.min(2560, Math.round(Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1))) || 1920;
  function thumb(id, w) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w; }
  function thumbAlt(id, w) { return 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w' + w; }
  function videoUrl(id) { return 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(id); }

  // ---------- Durum ----------
  var items = [], queue = [], hist = [], current = null;
  var timer = null, listTimer = null, seq = 0, paused = false, fails = 0, night = false, wakeLock = null;

  // ---------- Yardımcılar ----------
  function showMsg(t) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; }
  function hideMsg() { $('msg').style.display = 'none'; }
  var toastT = null;
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.style.opacity = 1;
    clearTimeout(toastT); toastT = setTimeout(function () { el.style.opacity = 0; }, 4000);
  }
  function schedule(fn, ms) { clearTimeout(timer); timer = null; if (paused) return; timer = setTimeout(fn, ms); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function byDate(desc) { return function (a, b) { return (a.tarih < b.tarih ? -1 : a.tarih > b.tarih ? 1 : 0) * (desc ? -1 : 1); }; }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }); }
    catch (e) { return ''; }
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // ---------- Liste çekme ----------
  function apiUrl() { return cfg.api + (cfg.api.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(); }

  function fetchList() {
    clearTimeout(listTimer);
    if (!cfg.api) return;
    var ok = false;
    fetch(apiUrl(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error((d && d.error) || 'Geçersiz yanıt');
        ok = true;
        var list = (d.items || []).filter(function (it) { return it.tur === 'image' || (cfg.video && it.tur === 'video'); });
        var had = items.length > 0, old = {}, now = {};
        items.forEach(function (it) { old[it.id] = 1; });
        list.forEach(function (it) { now[it.id] = 1; });
        var fresh = had ? list.filter(function (it) { return !old[it.id]; }) : [];
        items = list;
        queue = queue.filter(function (it) { return now[it.id]; });
        hist = hist.filter(function (it) { return now[it.id]; });
        if (fresh.length) {
          fresh.sort(byDate(true));
          queue = fresh.concat(queue);           // yeni gelenler sıradaki ilk görseller olur
          toast(fresh.length + ' yeni dosya eklendi');
        }
        updateCount();
        if (!items.length) { clearStage(); showMsg('Klasörde henüz fotoğraf yok.\nDrive\'daki "Çerçeve" klasörüne eklediğinizde burada görünecek.'); return; }
        hideMsg();
        if (!current || !now[current.id]) next();
      })
      .catch(function (e) {
        if (!items.length) showMsg('Fotoğraf listesi alınamadı.\n' + e.message + '\nBirazdan tekrar denenecek.');
      })
      .then(function () {
        listTimer = setTimeout(fetchList, ok || items.length ? Math.max(1, cfg.yenile) * 60000 : 30000);
      });
  }

  function buildQueue() {
    var a = items.slice();
    if (cfg.sira === 'karisik') shuffle(a);
    else a.sort(byDate(cfg.sira === 'yeni'));
    if (current && a.length > 1 && a[0].id === current.id) a.push(a.shift());
    queue = a;
  }

  function updateCount() {
    var f = 0, v = 0;
    items.forEach(function (it) { if (it.tur === 'video') v++; else f++; });
    $('cnt').textContent = f + ' fotoğraf' + (v ? ' · ' + v + ' video' : '');
  }

  // ---------- Hava durumu (Open-Meteo, anahtarsız) ----------
  var wx = null, wxAt = 0;
  var GUNLER = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
  function fetchWeather() {
    if (Date.now() - wxAt < 20 * 60000 && wx) return;
    var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + cfg.lat + '&longitude=' + cfg.lon +
      '&current=temperature_2m,weather_code,is_day' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=auto&forecast_days=5';
    fetch(u).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.current) return;
      wx = {
        t: Math.round(d.current.temperature_2m), code: d.current.weather_code, day: d.current.is_day === 1,
        max: d.daily ? Math.round(d.daily.temperature_2m_max[0]) : null,
        min: d.daily ? Math.round(d.daily.temperature_2m_min[0]) : null,
        days: []
      };
      if (d.daily && d.daily.time) {
        for (var i = 0; i < d.daily.time.length; i++) {
          var pp = d.daily.precipitation_probability_max;
          wx.days.push({
            date: d.daily.time[i], code: d.daily.weather_code[i],
            max: Math.round(d.daily.temperature_2m_max[i]), min: Math.round(d.daily.temperature_2m_min[i]),
            pop: pp && pp[i] != null ? pp[i] : null
          });
        }
      }
      wxAt = Date.now();
    }).catch(function () {});
  }
  function wxKind(c) {
    if (c === 0) return 'clear';
    if (c === 1 || c === 2) return 'partly';
    if (c === 3) return 'cloud';
    if (c === 45 || c === 48) return 'fog';
    if (c >= 51 && c <= 67) return 'rain';
    if (c >= 80 && c <= 82) return 'rain';
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
    if (c >= 95) return 'storm';
    return 'cloud';
  }
  function wxDesc(c) {
    var m = { 0: 'Açık', 1: 'Az bulutlu', 2: 'Parçalı bulutlu', 3: 'Kapalı', 45: 'Sisli', 48: 'Kırağılı sis',
      51: 'Hafif çisenti', 53: 'Çisenti', 55: 'Yoğun çisenti', 56: 'Dondurucu çisenti', 57: 'Dondurucu çisenti',
      61: 'Hafif yağmurlu', 63: 'Yağmurlu', 65: 'Kuvvetli yağmur', 66: 'Dondurucu yağmur', 67: 'Dondurucu yağmur',
      71: 'Hafif kar', 73: 'Karlı', 75: 'Yoğun kar', 77: 'Kar taneleri', 80: 'Hafif sağanak', 81: 'Sağanak',
      82: 'Şiddetli sağanak', 85: 'Kar sağanağı', 86: 'Yoğun kar sağanağı', 95: 'Gök gürültülü', 96: 'Dolu ihtimali', 99: 'Dolulu fırtına' };
    return m[c] || '';
  }
  function wxIcon(kind, day) {
    var Y = '#FFC94A', C = '#E8EDF3', C2 = '#B9C3CF', B = '#7FC4FF';
    var sun = '<circle cx="32" cy="32" r="12" fill="' + Y + '"/>' +
      '<g stroke="' + Y + '" stroke-width="4" stroke-linecap="round">' +
      '<line x1="32" y1="5" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="59"/><line x1="5" y1="32" x2="12" y2="32"/>' +
      '<line x1="52" y1="32" x2="59" y2="32"/><line x1="13" y1="13" x2="18" y2="18"/><line x1="46" y1="46" x2="51" y2="51"/>' +
      '<line x1="13" y1="51" x2="18" y2="46"/><line x1="46" y1="18" x2="51" y2="13"/></g>';
    var moon = '<path d="M40 8a24 24 0 1 0 16 38A20 20 0 0 1 40 8z" fill="#F4E3A1"/>';
    var cloud = function (f, dy) { dy = dy || 0; return '<path transform="translate(0 ' + dy + ')" d="M18 50h30a11 11 0 0 0 0-22 15 15 0 0 0-28-3A10 10 0 0 0 18 50z" fill="' + f + '"/>'; };
    var small = function (inner) { return '<g transform="translate(-6 -8) scale(.62)">' + inner + '</g>'; };
    var body;
    if (kind === 'clear') body = day ? sun : moon;
    else if (kind === 'partly') body = small(day ? sun : moon) + cloud(C, 4);
    else if (kind === 'cloud') body = cloud(C2, -4) + cloud(C, 4);
    else if (kind === 'fog') body = cloud(C2, -8) + '<g stroke="' + C + '" stroke-width="4" stroke-linecap="round"><line x1="12" y1="50" x2="52" y2="50"/><line x1="18" y1="58" x2="46" y2="58"/></g>';
    else if (kind === 'rain') body = cloud(C, -8) + '<g stroke="' + B + '" stroke-width="4" stroke-linecap="round"><line x1="22" y1="48" x2="18" y2="58"/><line x1="33" y1="48" x2="29" y2="58"/><line x1="44" y1="48" x2="40" y2="58"/></g>';
    else if (kind === 'snow') body = cloud(C, -8) + '<g fill="#fff"><circle cx="21" cy="52" r="3"/><circle cx="32" cy="57" r="3"/><circle cx="43" cy="52" r="3"/></g>';
    else body = cloud(C2, -8) + '<path d="M34 44l-8 10h7l-4 9 11-13h-7l4-6z" fill="' + Y + '"/>';
    return '<svg viewBox="0 0 64 64">' + body + '</svg>';
  }

  // ---------- Saat & hava durumu ara ekranı ----------
  var sayac = 0, onAra = false;
  function araHtml() {
    var d = new Date();
    var html = '<div class="wrap">' +
      '<div class="big"><span class="hh">' + pad(d.getHours()) + '</span><span class="col">:</span><span class="mm2">' + pad(d.getMinutes()) + '</span></div>' +
      '<div class="date">' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' <b>' + GUNLER[d.getDay()] + '</b></div>';
    if (wx) {
      html += '<div class="sep"></div><div class="wx">' + wxIcon(wxKind(wx.code), wx.day) +
        '<div class="t"><div class="deg">' + wx.t + '°</div><div class="desc">' + wxDesc(wx.code) + '</div>' +
        (wx.max !== null ? '<div class="mm">En yüksek ' + wx.max + '° · En düşük ' + wx.min + '°</div>' : '') +
        '</div></div><div class="city">' + cfg.sehir + '</div>' + umbHtml();
    }
    return html + '</div>';
  }
  function umbHtml() {
    var t = wx && wx.days && wx.days[0];
    if (!t || t.pop === null || t.pop < 50) return '';
    return '<div class="umb">☔ Bugün yağış ihtimali %' + t.pop + ' · şemsiyenizi almayı unutmayın</div>';
  }
  var KISA = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
  function havaHtml() {
    var h = '<div class="wrap hv"><div class="head">' + cfg.sehir + ' · Hava durumu</div>' +
      '<div class="now">' + wxIcon(wxKind(wx.code), wx.day) +
      '<div class="t"><div class="deg">' + wx.t + '°</div><div class="desc">' + wxDesc(wx.code) + '</div>' +
      (wx.max !== null ? '<div class="mm">En yüksek ' + wx.max + '° · En düşük ' + wx.min + '°</div>' : '') +
      '</div></div><div class="days">';
    wx.days.forEach(function (d, i) {
      var p = d.date.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);
      var n = i === 0 ? 'Bugün' : i === 1 ? 'Yarın' : KISA[dt.getDay()];
      h += '<div class="day' + (i === 0 ? ' today' : '') + '"><div class="n">' + n + '</div>' +
        wxIcon(wxKind(d.code), true) +
        '<div class="x">' + d.max + '° <span>' + d.min + '°</span></div>' +
        '<div class="p">' + (d.pop !== null && d.pop >= 20 ? '💧 %' + d.pop : '') + '</div></div>';
    });
    return h + '</div>' + umbHtml() + '</div>';
  }

  // ---------- Not panosu ----------
  var notlar = [], gorulenNot = {}, notIlk = true, bekleyenNot = false;
  function apiCall(q) { return cfg.api + (cfg.api.indexOf('?') > -1 ? '&' : '?') + q + '&_=' + Date.now(); }
  function fetchNotes() {
    if (!cfg.api || !cfg.ekNot) return;
    fetch(apiCall('islem=notlar'), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) return;
        var yeni = false;
        (d.notlar || []).forEach(function (n) {
          if (!gorulenNot[n.id]) { gorulenNot[n.id] = 1; if (!notIlk) yeni = true; }
        });
        notlar = d.notlar || [];
        notIlk = false;
        if (yeni) { bekleyenNot = true; toast('💌 Yeni not geldi'); }
      }).catch(function () {});
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function notZaman(iso) {
    var d = new Date(iso), n = new Date();
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (d.toDateString() === n.toDateString()) return 'bugün ' + hm;
    var y = new Date(n); y.setDate(n.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'dün ' + hm;
    return fmtDate(iso);
  }
  function notHtml(yeni) {
    var list = notlar.slice(0, 3), rot = [-2.2, 1.6, -1.2];
    var h = '<div class="wrap nt' + (yeni ? ' yeni' : '') + '"><div class="head">' + (yeni ? '💌 Yeni not' : '📌 Not panosu') + '</div>' +
      '<div class="notes n' + list.length + '">';
    list.forEach(function (n, i) {
      h += '<div class="note ' + esc(n.renk || 'sari') + '" style="-webkit-transform:rotate(' + rot[i] + 'deg);transform:rotate(' + rot[i] + 'deg)">' +
        '<div class="txt">' + esc(n.metin) + '</div>' +
        '<div class="by">— ' + esc(n.yazan) + ' · ' + notZaman(n.tarih) + '</div></div>';
    });
    return h + '</div></div>';
  }

  // ---------- Filtreli haberler ----------
  var haberler = [], haberSayfa = 0;
  function fetchNews() {
    if (!cfg.api || !cfg.ekHaber) return;
    fetch(apiCall('islem=haberler&kat=' + encodeURIComponent(cfg.haberKat)), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok && d.haberler) haberler = d.haberler; })
      .catch(function () {});
  }
  function onceZaman(iso) {
    if (!iso) return '';
    var dk = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (dk < 1) return 'az önce';
    if (dk < 60) return dk + ' dk önce';
    if (dk < 24 * 60) return Math.round(dk / 60) + ' saat önce';
    return Math.round(dk / 1440) === 1 ? 'dün' : Math.round(dk / 1440) + ' gün önce';
  }
  function haberHtml() {
    var per = 5, sayfa = Math.max(1, Math.ceil(haberler.length / per));
    var pg = haberSayfa % sayfa; haberSayfa++;
    var list = haberler.slice(pg * per, pg * per + per);
    var h = '<div class="wrap hb"><div class="head">📰 Gündem' + (sayfa > 1 ? ' · ' + (pg + 1) + '/' + sayfa : '') + '</div>';
    list.forEach(function (n) {
      h += '<div class="hi"><div class="chip k-' + esc(n.kat) + '">' + esc(n.katAd) + '</div><div>' +
        '<div class="ttl">' + esc(n.baslik) + '</div>' +
        '<div class="meta">' + esc(n.kaynak) + (n.tarih ? ' · ' + onceZaman(n.tarih) : '') + '</div></div></div>';
    });
    return h + '</div>';
  }

  // ---------- Spor ----------
  var takimlar = [];
  var AYLAR = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
  function fetchSpor() {
    if (!cfg.api || !cfg.ekSpor) return;
    fetch(apiCall('islem=spor'), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok && d.takimlar) takimlar = d.takimlar; })
      .catch(function () {});
  }
  function seciliTakimlar() {
    return takimlar.filter(function (t) { return (',' + cfg.sporTakim + ',').indexOf(',' + t.id + ',') > -1; });
  }
  function macTarih(iso) {
    var d = new Date(iso), n = new Date();
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var y = new Date(n); y.setDate(n.getDate() + 1);
    if (d.toDateString() === n.toDateString()) return 'Bugün ' + hm;
    if (d.toDateString() === y.toDateString()) return 'Yarın ' + hm;
    return KISA[d.getDay()] + ' ' + d.getDate() + ' ' + AYLAR[d.getMonth()] + ' ' + hm;
  }
  function gbm(m) {
    if (!m || m.evSkor === null || m.depSkor === null) return '';
    var biz = m.evde ? m.evSkor : m.depSkor, onlar = m.evde ? m.depSkor : m.evSkor;
    return biz > onlar ? 'G' : biz === onlar ? 'B' : 'M';
  }
  function geriSayim(iso) {
    var dk = Math.round((new Date(iso).getTime() - Date.now()) / 60000);
    if (dk <= 0) return 'Başlamak üzere';
    var s = Math.floor(dk / 60), m = dk % 60;
    return (s ? s + ' saat ' : '') + m + ' dk kaldı';
  }
  // Bugün maçı olanlar: başlamamış/oynanan (sonraki) veya bugün bitmiş (son)
  function bugunMaclar() {
    var bugun = new Date().toDateString(), now = Date.now(), out = [];
    seciliTakimlar().forEach(function (t) {
      var n = t.sonraki, l = t.son;
      if (n && n.tarih && new Date(n.tarih).toDateString() === bugun && now < new Date(n.tarih).getTime() + 150 * 60000) {
        out.push({ t: t, m: n, durum: now >= new Date(n.tarih).getTime() ? 'canli' : 'once' });
      } else if (l && l.tarih && l.evSkor !== null && new Date(l.tarih).toDateString() === bugun) {
        out.push({ t: t, m: l, durum: 'bitti' });
      }
    });
    return out.slice(0, 2);
  }
  function sporHtml() {
    var h = '<div class="wrap sp"><div class="head">🏆 Takımlarımız</div><div class="grid">';
    seciliTakimlar().forEach(function (t) {
      h += '<div class="tk"><div class="tt">' + t.ikon + ' ' + esc(t.ad).toLocaleUpperCase('tr-TR') + ' <span>· ' + esc(t.brans) + '</span></div>';
      if (t.son && t.son.evSkor !== null) {
        var r = gbm(t.son);
        h += '<div class="row2"><span class="gbm g-' + r + '">' + r + '</span>' + esc(t.son.ev) + ' <b>' + t.son.evSkor + ' – ' + t.son.depSkor + '</b> ' + esc(t.son.dep) +
          '<small>' + (t.son.tarih ? new Date(t.son.tarih).getDate() + ' ' + AYLAR[new Date(t.son.tarih).getMonth()] : '') +
          (t.son.lig === 'haberden' ? ' · haberden' : '') + '</small></div>';
      }
      if (t.sonraki) {
        var rakip = t.sonraki.evde ? t.sonraki.dep : t.sonraki.ev;
        h += '<div class="row2 nx">▸ ' + macTarih(t.sonraki.tarih) + ' · ' + esc(rakip) + ' <small>' + (t.sonraki.evde ? 'iç saha' : 'deplasman') + (t.sonraki.lig ? ' · ' + esc(t.sonraki.lig) : '') + '</small></div>';
      }
      var hn = t.haberler || [];
      var adet = (t.son || t.sonraki) ? 1 : 2;
      for (var i = 0; i < Math.min(adet, hn.length); i++) h += '<div class="hd">📰 ' + esc(hn[i].baslik) + '</div>';
      h += '</div>';
    });

  }

    cfg.ekSpor = $('oEkSpor').checked;
    cfg.ekAni = $('oEkAni').checked;
    if (cfg.ekSpor && !takimlar.length) fetchSpor();
    cfg.gecis = $('oGecis').value; cfg.sira = $('oSira').value;
    cfg.yenile = +$('oYenile').value; cfg.video = $('oVideo').checked; cfg.ses = $('oSes').checked;
    cfg.bilgi = $('oBilgi').checked; cfg.saat = $('oSaat').checked; cfg.bulanik = $('oBulanik').checked;
    cfg.geceBas = $('oGeceBas').value; cfg.geceBit = $('oGeceBit').value;
    cfg.api = $('oApi').value.replace(/^\s+|\s+$/g, '');
    saveCfg(); closeSettings(); tick();
    if (current) updateInfo(current);
    if (before.api !== cfg.api || before.video !== cfg.video) {
      items = []; queue = []; hist = []; clearStage(); showMsg('Yükleniyor…'); fetchList();
    } else {
      if (before.sira !== cfg.sira) queue = [];
      if ((before.yerlesim !== cfg.yerlesim || before.bulanik !== cfg.bulanik) && current && !onAra) show(current);
      else if (!paused && current && current.tur === 'image') schedule(next, cfg.sure * 1000);
    }
    var v = stage.querySelector('.slide.on video'); if (v) v.muted = !cfg.ses;
    toast('Ayarlar kaydedildi');
  });

  // ---------- İlk kurulum ----------
  function validApi(u) { return /^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u); }
  $('sGo').addEventListener('click', function () {
    var u = $('sApi').value.replace(/^\s+|\s+$/g, '');
    if (!validApi(u)) { $('sErr').textContent = 'Adres https://script.google.com/... ile başlamalı.'; return; }
    cfg.api = u; saveCfg();
    $('setup').className = 'panel'; document.body.className = 'nocursor';
    goFull(); keepAwake(); firstTouch = false;
    start();
  });

  function start() {
    showMsg('Yükleniyor…');
    fetchList();
    fetchNotes();
    fetchNews();
    fetchSpor();
  }

  // ---------- Başlat ----------
  tick();
  setInterval(tick, 5000);
  fetchWeather();
  setInterval(fetchWeather, 30 * 60000);
  fetchNotes();
  setInterval(fetchNotes, 60000);
  fetchNews();
  setInterval(fetchNews, 30 * 60000);
  fetchSpor();
  setInterval(fetchSpor, 10 * 60000);
  if (cfg.api) start();
  else { $('setup').className = 'panel show'; document.body.className = ''; }

  // test için dışa aç
  window.__cerceve = { cfg: cfg, state: function () { return { items: items.length, queue: queue.length, current: current && current.id, paused: paused, night: night }; }, next: next, prev: prev, ara: showAra, ekran: siradakiEkran, notlar: fetchNotes };
})();
</script>
</body>
</html>
